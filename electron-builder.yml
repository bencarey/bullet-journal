appId: com.bencarey.bullet-journal
productName: Bullet Journal
directories:
  buildResources: build
files:
  - main.js
  - preload.js
  - journal.html
  - package.json
  - config.js
  - manifest.json
  - icon-192.png
  - icon-512.png
mac:
  icon: icon.icns
  target: dmg
dmg:
  artifactName: BulletJournal-${version}.${ext}
  title: Bullet Journal ${version}
  background: build/dmg_background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
      type: file
    - x: 390
      y: 190
      type: link
      path: /Applications
